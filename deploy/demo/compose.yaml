# The always-on demo server's stack (m7g.2xlarge: 8 vCPU, 32 GB, ARM; ADR 0031). Synced from S3
# to /opt/sotto by deploy.sh. Image tags come from tags.env (written on each deploy); secrets and
# settings from SSM via .env. Memory limits keep one runaway service from starving the rest.
name: sotto

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://sotto:${POSTGRES_PASSWORD}@postgres:5432/sotto
  REDIS_URL: redis://redis:6379
  RABBITMQ_URL: amqp://sotto:${RABBITMQ_PASSWORD}@rabbitmq:5672
  # The origin people open: sign-in links, invites and passkeys belong to it.
  APP_URL: https://${SITE_ADDRESS}

# Object storage (Phase 4): the dev bucket's files/ prefix on S3, no endpoint (AWS's own).
# Containers can't reach the server's IAM role (IMDS hop limit 1, terraform/dev/demo.tf), so the
# app signs with its own keys, scoped to files/ (ADR 0018; SSM /sotto/demo/S3_*). Browsers
# upload to S3 directly with presigned URLs (the bucket's CORS rule allows this site;
# terraform/dev/storage.tf).
x-storage-env: &storage-env
  S3_BUCKET: ${FILES_BUCKET}
  S3_REGION: ${AWS_REGION}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}

# Real AI on the demo (ADR 0031), all inside the server: Ollama serves the embedding model and a
# Private chat model (DEMO_CHAT_MODEL from SSM, llama3.1:8b by default), so Ask answers, notes
# and live notes are written privately. The api and worker must embed with the same model.
x-ai-env: &ai-env
  AI_EMBEDDINGS: ollama:nomic-embed-text
  OLLAMA_URL: http://ollama:11434
  AI_PRIVATE_CHAT: ollama:${DEMO_CHAT_MODEL:-llama3.1:8b}

x-logging: &logging # Cap log files so a chatty service can't fill the disk.
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  caddy:
    # Automatic HTTPS (Let's Encrypt). SITE_ADDRESS is <ip>.sslip.io until sotto.ai is bought.
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates — keep them across restarts to avoid rate limits
      - caddy_config:/config
    deploy: { resources: { limits: { memory: 64m } } }
    logging: *logging

  web:
    image: ${ECR_REGISTRY}/sotto/web:${WEB_TAG:-main}
    restart: unless-stopped
    environment:
      API_URL: http://api:4000
    deploy: { resources: { limits: { memory: 512m } } }
    logging: *logging

  api:
    image: ${ECR_REGISTRY}/sotto/api:${API_TAG:-main}
    restart: unless-stopped
    environment:
      <<: [*app-env, *storage-env, *ai-env]
      PORT: "4000"
      ASK_RATE_PER_MINUTE: "10" # a public demo: fewer questions per person per minute
      # Phase 6 (ADR 0023): wraps each workspace's own AI keys. From SSM
      # /sotto/demo/AI_KEYS_MASTER (terraform/dev/ssm.tf). Empty → keys can't be saved, and the
      # AI settings screen says so.
      AI_KEYS_MASTER: ${AI_KEYS_MASTER:-}
      # Managed mode (ADR 0024): Sotto's own provider account. Empty until the owner picks the
      # demo's provider and adds /sotto/demo/AI_MANAGED_CHAT and AI_MANAGED_KEY to SSM.
      AI_MANAGED_CHAT: ${AI_MANAGED_CHAT:-}
      AI_MANAGED_KEY: ${AI_MANAGED_KEY:-}
      # Payments (ADR 0026): no key → the labelled test checkout (nothing charged). A Paystack
      # *test* key and plan codes in SSM switch to Paystack test mode; live keys are refused.
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_PLAN_PRO_MONTHLY: ${PAYSTACK_PLAN_PRO_MONTHLY:-}
      PAYSTACK_PLAN_PRO_YEARLY: ${PAYSTACK_PLAN_PRO_YEARLY:-}
      PAYSTACK_PLAN_BUSINESS_MONTHLY: ${PAYSTACK_PLAN_BUSINESS_MONTHLY:-}
      PAYSTACK_PLAN_BUSINESS_YEARLY: ${PAYSTACK_PLAN_BUSINESS_YEARLY:-}
      AUTH_SECRET: ${AUTH_SECRET}
      # Phase 7 Listen mode: live audio chunks go straight to the transcriber.
      TRANSCRIBER_URL: http://transcriber:5000
      # Mailpit until SES (ADR 0015): switch SMTP_URL to SES's SMTP endpoint once sotto.ai exists.
      SMTP_URL: smtp://mailpit:1025
      MAIL_FROM: Sotto <no-reply@${SITE_ADDRESS}>
      # Google and Microsoft buttons appear once these SSM parameters exist (/sotto/demo/...).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
    depends_on:
      postgres: { condition: service_healthy }
      ollama: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 1g } } }
    logging: *logging

  migrate:
    image: ${ECR_REGISTRY}/sotto/api:${API_TAG:-main}
    command: ["sh", "scripts/migrate.sh"]
    environment:
      DATABASE_URL: postgresql://sotto:${POSTGRES_PASSWORD}@postgres:5432/sotto
    profiles: ["tools"] # only runs when deploy.sh asks for it
    logging: *logging

  # Everything for real (ADR 0031): embeddings and meeting notes through Ollama, transcripts
  # from faster-whisper below.
  worker:
    image: ${ECR_REGISTRY}/sotto/worker:${WORKER_TAG:-main}
    restart: unless-stopped
    environment:
      <<: [*app-env, *storage-env, *ai-env]
      WORKER_HEALTH_PORT: "4100"
      WORKER_CONCURRENCY: "2"
    depends_on:
      ollama: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 1g } } }
    logging: *logging

  transcriber:
    image: ${ECR_REGISTRY}/sotto/transcriber:${TRANSCRIBER_TAG:-main}
    restart: unless-stopped
    environment:
      <<: *storage-env
      RABBITMQ_URL: amqp://sotto:${RABBITMQ_PASSWORD}@rabbitmq:5672
      # Real transcription on the CPU. `small` is clearly better than `base` and still several
      # times faster than real time on 8 Graviton cores; the model downloads once into /models.
      TRANSCRIBER_ENGINE: faster-whisper
      WHISPER_MODEL: small
      WHISPER_THREADS: "4" # leave cores for Ollama
    volumes: ["whisper:/models"]
    deploy: { resources: { limits: { memory: 4g } } }
    logging: *logging

  # Private AI inside the server (ADR 0031). On first start it pulls the embedding model and the
  # chat model (~5 GB) into its volume; it reports healthy only once both are there, so the api
  # and worker never start against a model that isn't loaded. Later starts find them at once.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull nomic-embed-text && ollama pull "$${CHAT_MODEL}"
        wait
    environment:
      CHAT_MODEL: ${DEMO_CHAT_MODEL:-llama3.1:8b}
      OLLAMA_KEEP_ALIVE: "24h" # keep the model in memory: no cold start on the next question
      OLLAMA_NUM_PARALLEL: "2"
    volumes: ["ollama:/root/.ollama"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'ollama list | grep -q nomic-embed-text && ollama list | grep -q "$${CHAT_MODEL%%:*}"',
        ]
      interval: 10s
      timeout: 5s
      retries: 180 # the first pull can take a few minutes
      start_period: 30s
    deploy: { resources: { limits: { memory: 16g } } }
    logging: *logging

  # The demo's mailbox (ADR 0015): catches every email the api sends; read it at /mail/ with the
  # password from `terraform output -raw demo_mail_password`. Nothing leaves the server.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_WEBROOT: /mail/
      MP_UI_AUTH: sotto:${MAILPIT_PASSWORD}
      MP_MAX_MESSAGES: "500"
    deploy: { resources: { limits: { memory: 64m } } }
    logging: *logging

  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: sotto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sotto
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sotto -d sotto"]
      interval: 5s
      timeout: 3s
      retries: 30
    deploy: { resources: { limits: { memory: 2g } } }
    logging: *logging

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--maxmemory",
        "96mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    deploy: { resources: { limits: { memory: 128m } } }
    logging: *logging

  rabbitmq:
    image: rabbitmq:4-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: sotto
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes: ["rabbitmq:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30
    deploy: { resources: { limits: { memory: 384m } } }
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  rabbitmq:
  ollama: # model weights (~6 GB): kept across deploys
  whisper: # the Whisper model: kept across deploys
