# The always-on demo server's stack (t4g.medium, 4 GB, ARM). Synced from S3 to /opt/sotto by
# deploy.sh. Image tags come from tags.env (written on each deploy); secrets from SSM via .env.
# Memory limits keep one runaway service from starving the rest on a small box.
name: sotto

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://sotto:${POSTGRES_PASSWORD}@postgres:5432/sotto
  REDIS_URL: redis://redis:6379
  RABBITMQ_URL: amqp://sotto:${RABBITMQ_PASSWORD}@rabbitmq:5672
  # The origin people open: sign-in links, invites and passkeys belong to it.
  APP_URL: https://${SITE_ADDRESS}

# Object storage (Phase 4): the dev bucket's files/ prefix on S3, no endpoint (AWS's own).
# Containers can't reach the server's IAM role (IMDS hop limit 1, terraform/dev/demo.tf), so the
# app signs with its own keys, scoped to files/ (ADR 0018; SSM /sotto/demo/S3_*). Browsers
# upload to S3 directly with presigned URLs (the bucket's CORS rule allows this site;
# terraform/dev/storage.tf).
x-storage-env: &storage-env
  S3_BUCKET: ${FILES_BUCKET}
  S3_REGION: ${AWS_REGION}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}

# LABELLED MOCKS on the demo (see the worker below): embeddings are the hash mock, and the api
# must embed questions with the same one, so Ask runs as keyword search. No chat model: Ask
# answers with the matching passages, labelled "Passages only". A hosted model is a Phase 6
# decision (STATUS → Open decisions).
x-ai-env: &ai-env
  AI_EMBEDDINGS: fake:fake-hash

x-logging: &logging
  # Cap log files so a chatty service can't fill the disk.
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  caddy:
    # Automatic HTTPS (Let's Encrypt). SITE_ADDRESS is <ip>.sslip.io until sotto.ai is bought.
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates — keep them across restarts to avoid rate limits
      - caddy_config:/config
    deploy: { resources: { limits: { memory: 64m } } }
    logging: *logging

  web:
    image: ${ECR_REGISTRY}/sotto/web:${WEB_TAG:-main}
    restart: unless-stopped
    environment:
      API_URL: http://api:4000
    deploy: { resources: { limits: { memory: 384m } } }
    logging: *logging

  api:
    image: ${ECR_REGISTRY}/sotto/api:${API_TAG:-main}
    restart: unless-stopped
    environment:
      <<: [*app-env, *storage-env, *ai-env]
      PORT: "4000"
      ASK_RATE_PER_MINUTE: "10" # a public demo: fewer questions per person per minute
      AUTH_SECRET: ${AUTH_SECRET}
      # Mailpit until SES (ADR 0015): switch SMTP_URL to SES's SMTP endpoint once sotto.ai exists.
      SMTP_URL: smtp://mailpit:1025
      MAIL_FROM: Sotto <no-reply@${SITE_ADDRESS}>
      # Google and Microsoft buttons appear once these SSM parameters exist (/sotto/demo/...).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
    depends_on:
      postgres: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 512m } } }
    logging: *logging

  migrate:
    image: ${ECR_REGISTRY}/sotto/api:${API_TAG:-main}
    command: ["sh", "scripts/migrate.sh"]
    environment:
      DATABASE_URL: postgresql://sotto:${POSTGRES_PASSWORD}@postgres:5432/sotto
    profiles: ["tools"] # only runs when deploy.sh asks for it
    logging: *logging

  # LABELLED MOCKS on the demo, until the owner decides its capacity (STATUS, Phase 4): this
  # 4 GB server has no room for Ollama and Whisper beside everything else. Uploads, reading
  # PDFs, the pipeline, the player and the transcript all run for real; embeddings are a
  # hash-based mock and transcripts are placeholder lines, both labelled in the app. To go
  # real: a bigger instance, then AI_EMBEDDINGS=ollama:nomic-embed-text with an ollama service,
  # and TRANSCRIBER_ENGINE=faster-whisper with a /models volume (see local/compose.yaml).
  worker:
    image: ${ECR_REGISTRY}/sotto/worker:${WORKER_TAG:-main}
    restart: unless-stopped
    environment:
      <<: [*app-env, *storage-env, *ai-env]
      WORKER_HEALTH_PORT: "4100"
      WORKER_CONCURRENCY: "1" # one job at a time on a small box
    deploy: { resources: { limits: { memory: 384m } } }
    logging: *logging

  transcriber:
    image: ${ECR_REGISTRY}/sotto/transcriber:${TRANSCRIBER_TAG:-main}
    restart: unless-stopped
    environment:
      <<: *storage-env
      RABBITMQ_URL: amqp://sotto:${RABBITMQ_PASSWORD}@rabbitmq:5672
      TRANSCRIBER_ENGINE: fake
    deploy: { resources: { limits: { memory: 512m } } }
    logging: *logging

  # The demo's mailbox (ADR 0015): catches every email the api sends; read it at /mail/ with the
  # password from `terraform output -raw demo_mail_password`. Nothing leaves the server.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_WEBROOT: /mail/
      MP_UI_AUTH: sotto:${MAILPIT_PASSWORD}
      MP_MAX_MESSAGES: "500"
    deploy: { resources: { limits: { memory: 64m } } }
    logging: *logging

  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: sotto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sotto
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sotto -d sotto"]
      interval: 5s
      timeout: 3s
      retries: 30
    deploy: { resources: { limits: { memory: 512m } } }
    logging: *logging

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    deploy: { resources: { limits: { memory: 128m } } }
    logging: *logging

  rabbitmq:
    image: rabbitmq:4-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: sotto
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes: ["rabbitmq:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30
    deploy: { resources: { limits: { memory: 384m } } }
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  rabbitmq:
