# The whole Sotto stack on one machine (your laptop or the AWS workbench).
#   task up      → build everything from ../sotto-api and ../sotto-web and start it
#   open http://localhost:8080
# Repos must be cloned side by side: sotto-platform/, sotto-api/, sotto-web/.
name: sotto

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgresql://sotto:sotto@postgres:5432/sotto
  REDIS_URL: redis://redis:6379
  RABBITMQ_URL: amqp://sotto:sotto@rabbitmq:5672
  # Phase 3 sign-in. The secret is for this machine only (production mode requires one); the
  # demo's comes from SSM. Sign-in links land in Mailpit: http://localhost:8025.
  APP_URL: http://localhost:8080
  AUTH_SECRET: local-compose-only-secret-never-used-on-a-server
  SMTP_URL: smtp://mailpit:1025

# Object storage (Phase 4). Services reach SeaweedFS directly; browsers upload through the
# gateway's /s3/ path, so presigned URLs are signed for that address and need no CORS. Local
# SeaweedFS runs without accounts, so the keys are placeholders the SDK insists on.
x-storage-env: &storage-env
  S3_ENDPOINT: http://s3:8333
  S3_PUBLIC_ENDPOINT: http://localhost:8080/s3
  S3_BUCKET: sotto-files
  S3_FORCE_PATH_STYLE: "true"
  S3_ACCESS_KEY_ID: local
  S3_SECRET_ACCESS_KEY: local

# AI (Phase 4–5): the worker embeds files and the api embeds each question with the SAME model,
# or Ask falls back to keyword search. Both reach Ollama inside this stack.
x-ai-env: &ai-env
  AI_EMBEDDINGS: ollama:nomic-embed-text
  OLLAMA_URL: http://ollama:11434
  # A private chat model writes meeting notes and Ask's answers. Uncomment after `docker compose
  # exec ollama ollama pull llama3.2:3b` (~3 GB RAM). Without it, notes are labelled "basic
  # notes" and Ask answers with the matching passages, labelled as such.
  # AI_PRIVATE_CHAT: ollama:llama3.2:3b
  # AI_ASK_CHAT: ollama:llama3.2:3b  # only if Ask should use a different model than notes

services:
  # ── Gateway: one origin, like production. /api/* → api, everything else → web ──
  gateway:
    image: caddy:2-alpine
    ports: ["8080:80"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: [web, api]

  web:
    build: ../../sotto-web
    environment:
      API_URL: http://api:4000

  api:
    build:
      context: ../../sotto-api
      args: { APP: api }
    environment:
      <<: [*api-env, *storage-env, *ai-env]
      PORT: "4000"
      ASK_RATE_PER_MINUTE: "20" # questions per person per minute
    ports: ["4000:4000"] # direct access for Swagger and debugging
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      s3-init: { condition: service_completed_successfully }

  # Runs pending migrations once, then exits. The api waits for it to succeed.
  migrate:
    build:
      context: ../../sotto-api
      args: { APP: api }
    command: ["sh", "scripts/migrate.sh"]
    environment:
      DATABASE_URL: postgresql://sotto:sotto@postgres:5432/sotto
    depends_on:
      postgres: { condition: service_healthy }

  # Extracts text, chunks it and embeds it (Ollama, in this stack); writes meeting notes.
  worker:
    build:
      context: ../../sotto-api
      args: { APP: worker }
    environment:
      <<: [*api-env, *storage-env, *ai-env]
    depends_on:
      rabbitmq: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      ollama-pull: { condition: service_completed_successfully }

  # Real transcription: ffmpeg + faster-whisper. `base` is a good laptop default; `small` is
  # more accurate and slower. The model downloads once into the models volume.
  transcriber:
    build: ../../sotto-api/services/transcriber
    environment:
      <<: *storage-env
      RABBITMQ_URL: amqp://sotto:sotto@rabbitmq:5672
      TRANSCRIBER_ENGINE: faster-whisper
      WHISPER_MODEL: base
    volumes: ["models:/models"]
    depends_on:
      rabbitmq: { condition: service_healthy }

  # Embeddings run here, in your stack: nothing leaves the machine.
  ollama:
    image: ollama/ollama:latest
    volumes: ["ollama:/root/.ollama"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 30

  # One-shot: downloads the embedding model (~270 MB) the first time, then exits.
  ollama-pull:
    image: ollama/ollama:latest
    environment: { OLLAMA_HOST: http://ollama:11434 }
    entrypoint: ["ollama", "pull", "nomic-embed-text"]
    depends_on:
      ollama: { condition: service_healthy }

  # ── Backing services ──
  postgres:
    image: pgvector/pgvector:pg18
    environment: { POSTGRES_USER: sotto, POSTGRES_PASSWORD: sotto, POSTGRES_DB: sotto }
    volumes: ["pgdata:/var/lib/postgresql"] # Postgres 18 keeps data under a versioned subfolder
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sotto -d sotto"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment: { RABBITMQ_DEFAULT_USER: sotto, RABBITMQ_DEFAULT_PASS: sotto }
    ports: ["15672:15672"] # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  s3:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333
    volumes: ["s3data:/data"]
    ports: ["8333:8333"] # for debugging with any S3 client

  # One-shot: creates the files bucket (an S3 PUT on the bucket; repeating it is harmless).
  s3-init:
    image: curlimages/curl:latest
    command: ["sh", "-c", "until curl -fs -o /dev/null -X PUT http://s3:8333/sotto-files; do sleep 1; done"]
    depends_on: [s3]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025"]

volumes:
  pgdata:
  s3data:
  models: # Whisper models, downloaded once
  ollama: # embedding (and optional chat) models
